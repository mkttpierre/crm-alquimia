<!--
  MODELO com três marcadores: `__APP_NAME__` (nome do sistema), `__ACCENT__` (cor
  do botão, em hex) e `__ACCENT_FG__` (cor do texto do botão). Nesta versão NENHUM
  script os substitui: o Supabase local que o instalador sobe (e o de dev e do CI)
  usa este arquivo cru, ligado em supabase/config.toml.

  Para o e-mail sair com a sua marca: troque os três marcadores à mão, nesta cópia e
  em recovery.html, e recrie o Supabase (`bash scripts/parar.sh` e o instalador de
  novo). Quem roda GoTrue próprio (GOTRUE_MAILER_TEMPLATES_CONFIRMATION) aponta para
  uma cópia já trocada, nunca para o modelo com marcador.

  As cores do botão vêm em PAR (`background: <fallback>; background: __ACCENT__;`)
  de propósito: declaração com valor inválido é DESCARTADA pelo CSS, então o
  arquivo cru — o que o Supabase local usa em dev e no CI — renderiza com o
  accent do produto em vez de um botão transparente. É a única forma de o
  modelo ser legível antes de ser substituído.

  `&`, nunca `?`: ver o comentário equivalente em recovery.html. `.RedirectTo`
  já chega com `?type=signup` embutido (app/actions/auth/signUp.ts).

  CABEÇALHO: a imagem de `{{ .SiteURL }}/icone-da-marca/email`, servida pelo próprio
  app (o e-mail só pode buscar imagem por URL absoluta; `.SiteURL` é o Site URL do
  GoTrue). Quem decide o que ela mostra é o app, na hora em que o e-mail é aberto:
  o sol e a escrita do produto quando nada está configurado, o nome da marca em
  texto quando algo está. Nenhum script de instalação participa, e este arquivo
  funciona cru. O `alt` é vazio de propósito: não há como pôr o nome da marca aqui
  sem um script, e o corpo do e-mail já o diz.
-->
<html>
  <body style="font-family: sans-serif; color: #1c1a16; background: #faf9f6; max-width: 480px; margin: 0 auto; padding: 24px;">
    <p style="margin: 0 0 24px;">
      <img
        src="{{ .SiteURL }}/icone-da-marca/email"
        width="150"
        height="40"
        alt=""
        style="display: block; border: 0; width: 150px; height: 40px;"
      />
    </p>
    <h2 style="font-size: 18px;">Confirme seu e-mail</h2>
    <p>Sua conta no __APP_NAME__ está quase pronta. Clique no botão abaixo para confirmar seu e-mail e ativar sua conta:</p>
    <p style="margin: 24px 0;">
      <a
        href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}"
        style="background: #506d48; background: __ACCENT__; color: #ffffff; color: __ACCENT_FG__; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block;"
        >Confirmar e-mail</a
      >
    </p>
    <p style="font-size: 12px; color: #7d786c;">Se você não criou esta conta, ignore este e-mail.</p>
  </body>
</html>
