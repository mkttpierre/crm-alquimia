# CRM ALQUIM(IA): instalação LOCAL de um comando.
#
# Quem sobe isto é o `scripts/instalar.sh` (Linux, Mac, Git Bash) ou o
# `scripts/instalar.ps1` (Windows PowerShell). Eles sobem antes o Supabase local
# (`supabase start`, pela CLI: banco, login, storage), aplicam o `supabase/baseline.sql`
# e gravam o `.env.local`, que este arquivo lê. Rode `docker compose` à mão só com
# `-p crm-alquimia` (o CRM_ALQUIMIA_PROJETO gravado no .env.local) e `--env-file .env.local`:
#
#   docker compose -p crm-alquimia --env-file .env.local up -d
#
# O `-p` explícito vale mesmo com o `name:` abaixo: um COMPOSE_PROJECT_NAME esquecido na sessão passa
# na frente do `name:` e faria o comando agir em OUTRO projeto da máquina.
#
# O que sobe aqui (os serviços DESTE compose só publicam porta em 127.0.0.1; o resto fica na rede interna):
#   app            o CRM (Next.js)                       http://localhost:3000
#   worker         o agente 24/7 (fila, follow-up)       healthz em 127.0.0.1:8787
#   scheduler      os crons (crond batendo no app)
#   evolution      WhatsApp por QR (Evolution API 2.3.7, versão travada + patch do Baileys)
#   evolution-db   banco da Evolution
#   redis + srh    limite de taxa (serverless-redis-http fala o REST do Upstash sobre o redis)
#
# O Supabase NÃO está aqui: ele roda pela CLI no próprio Docker e os contêineres falam com ele
# por `host.docker.internal`. ATENÇÃO: ao contrário dos serviços abaixo, o Supabase da CLI publica a API
# (54321) e o banco (54322) em TODAS as interfaces da máquina, com a senha padrão da CLI. Use em rede
# confiável ou bloqueie essas portas no firewall (README e SECURITY.md). Os três serviços do CRM são CONSTRUÍDOS do código desta pasta
# (Dockerfile, Dockerfile.worker, Dockerfile.scheduler).
#
# Portas: o padrão pode ser trocado sem editar este arquivo (variáveis que o instalador lê):
#   CRM_ALQUIMIA_PORTA_APP (3000) · CRM_ALQUIMIA_PORTA_WORKER (8787) · CRM_ALQUIMIA_PORTA_EVOLUTION (8080)

name: crm-alquimia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-host-docker: &host-docker
  # Linux não tem `host.docker.internal` por padrão; no Docker Desktop (Windows/Mac) isto é inofensivo.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        # Memória do Node ao compilar o app (MB). Pouca RAM: CRM_ALQUIMIA_HEAP_BUILD_MB=2048 com CRM_ALQUIMIA_BUILD_CPUS=1.
        NODE_HEAP_MB: ${CRM_ALQUIMIA_HEAP_BUILD_MB:-4096}
        # CPUs (threads do Turbopack e workers do Next) ao compilar o app. Menos CPUs = menos memória.
        BUILD_CPUS: ${CRM_ALQUIMIA_BUILD_CPUS:-2}
        # Type-check do TypeScript no build (0 = pula; quem cobra os tipos é o CI). 1 liga de novo.
        BUILD_TYPECHECK: ${CRM_ALQUIMIA_BUILD_TYPECHECK:-0}
    image: crm-alquimia-app:local
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "127.0.0.1:${CRM_ALQUIMIA_PORTA_APP:-3000}:3000"
    depends_on:
      srh:
        condition: service_started
    healthcheck:
      # Probe TCP puro: /api/v1/health responde 503 se um serviço opcional cai e derrubaria o app junto.
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging
    <<: *host-docker

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: crm-alquimia-worker:local
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "127.0.0.1:${CRM_ALQUIMIA_PORTA_WORKER:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    <<: *host-docker

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: crm-alquimia-scheduler:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET ausente, rode scripts/instalar.sh (ou instalar.ps1)}
    logging: *logging

  redis:
    # Travado por digest (a tag móvel muda de binário sem aviso); a tag fica ao lado só para leitura.
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    # Efêmero de propósito: só limite de taxa e debounce.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # A imagem declara VOLUME /data: sem nada montado ali, cada `up` depois de um `down` deixava um volume
    # anônimo órfão. O tmpfs ocupa o ponto de montagem e não guarda nada no disco.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logging

  srh:
    # serverless-redis-http: o SDK @upstash/redis do app fala REST; isto traduz para o redis comum.
    # Travado por digest (a tag móvel já mudou de binário uma vez).
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?SRH_TOKEN ausente, rode scripts/instalar.sh (ou instalar.ps1)}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  evolution-db:
    # Travado por digest, como a Evolution: o formato do volume depende da versão do Postgres.
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD ausente, rode scripts/instalar.sh (ou instalar.ps1)}
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  evolution:
    # Evolution 2.3.7 / Baileys 7.0.0-rc.9, travada por DIGEST. O patch montado abaixo só vale para
    # este digest: antes de trocar a imagem, leia docker/evolution/LEIA-ME.md.
    image: evoapicloud/evolution-api@sha256:966625532d9076a2381e973a271307d107e6f070450de3abeeea8bd18be07252
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      app:
        condition: service_started
    # Log com teto: LOG_BAILEYS=debug escreve muito.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    environment:
      SERVER_URL: http://localhost:${CRM_ALQUIMIA_PORTA_EVOLUTION:-8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY ausente, rode scripts/instalar.sh (ou instalar.ps1)}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Webhook GLOBAL: uma URL para todas as conexões, com o segredo no caminho (a Evolution não
      # aceita cabeçalho na URL global). É a rota que o app já tem, em modo "token global":
      # app/api/v1/webhooks/channel/[token]/route.ts acha a conexão pelo nome da instância do corpo.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://app:3000/api/v1/webhooks/evolution/${EVOLUTION_WEBHOOK_TOKEN:?EVOLUTION_WEBHOOK_TOKEN ausente, rode scripts/instalar.sh (ou instalar.ps1)}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      # A MESMA lista de EVENTOS_DO_WEBHOOK em lib/channels/evolution/client.ts (um teste confere).
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "true"
      WEBHOOK_EVENTS_MESSAGES_EDITED: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_CALL: "true"
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${CRM_ALQUIMIA_PORTA_EVOLUTION:-8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances
      # Patch do Baileys: ack da stanza <status> (sem ele, resposta de lead e tique chegam horas depois).
      - ./docker/evolution/baileys-messages-recv.js:/evolution/node_modules/baileys/lib/Socket/messages-recv.js:ro
    <<: *host-docker

volumes:
  evolution_db:
  evolution_instances:
